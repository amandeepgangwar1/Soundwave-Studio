  </defs>
  <rect x="12" y="26" width="5" height="24" rx="2.5" fill="url(#waveGradient)" opacity="0.8"/>
  <rect x="20" y="14" width="5" height="36" rx="2.5" fill="url(#waveGradient)"/>
  <rect x="28" y="20" width="5" height="30" rx="2.5" fill="url(#waveGradient)"/>
  <rect x="36" y="16" width="5" height="34" rx="2.5" fill="url(#waveGradient)"/>
  <rect x="44" y="24" width="5" height="26" rx="2.5" fill="url(#waveGradient)" opacity="0.8"/>
